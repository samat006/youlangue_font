name: video_translator_app
description: Traduction vidéo en temps réel multi-plateforme
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.2.2

  # UI & Navigation
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  
  # State Management
  provider: ^6.1.1
  
  # Network
  http: ^1.2.0
  web_socket_channel: ^2.4.0
  
  # YouTube
  youtube_player_flutter: ^9.0.0
  youtube_explode_dart: ^2.1.0  # Pour recherche YouTube
  
  # Audio
  audio_session: ^0.1.18
  audioplayers: ^5.2.1    # ✅ ALTERNATIVE
  just_audio: ^0.9.42
  path_provider: ^2.1.0

  # Storage
  shared_preferences: ^2.2.2
  
  # Utils
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # WebView
  webview_flutter: ^4.4.4

  file_picker: ^8.0.0
  path: ^1.9.0
  video_player: ^2.8.0  # ✅ NOUVEAU
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: assets/images/voxtube_logo.png

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

